name: apply-schema
# Manual only. Applies db/schema_tech.sql and db/schema_notifications.sql, then
# reloads the PostgREST schema cache once. Never runs on a schedule and is never
# part of a scrape.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type APPLY to run the tech schema against production
        required: true
        type: string

concurrency:
  group: job-radar-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    if: ${{ inputs.confirm == 'APPLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Apply additive schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: python db/apply_schema.py
