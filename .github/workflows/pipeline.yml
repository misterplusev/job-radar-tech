name: Read-only Discord wiring audit
run-name: discord-wiring-audit-20261111
on: workflow_dispatch
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect metadata and existing messages with GET only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUDIT_WEBHOOK_TECH: ${{ secrets.DISCORD_WEBHOOK_JOBS }}
        run: python audit_discord_job_routes.py tech
      - uses: actions/upload-artifact@v4
        with:
          name: discord-wiring-audit
          path: discord-wiring-audit.json
