<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Job Radar — Tech Jobs Monitor</title><style>
:root{color-scheme:dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;background:#0d1117;color:#e6edf3}
header{padding:16px 20px;border-bottom:1px solid #30363d;background:#0d1117}
h1{margin:0 0 4px;font-size:1.75rem;font-weight:600}
.muted{color:#8b949e;font-size:.875rem}
.controls{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;position:sticky;top:0;background:#0d1117;border-bottom:1px solid #21262d;z-index:5}
input,select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 10px;font-size:.875rem}
input:focus,select:focus{border-color:#58a6ff;outline:none}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 12px;border-bottom:1px solid #21262d;text-align:left;vertical-align:middle}
th{position:sticky;top:61px;background:#161b22;color:#8b949e;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;z-index:2}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
.logo{width:22px;height:22px;border-radius:6px;background:#161b22;border:1px solid #30363d;object-fit:contain;padding:1px;vertical-align:middle;margin-right:2px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border:1px solid #30363d;border-radius:999px;color:#8b949e;background:#161b22}
.pill.closed{color:#f85149;border-color:rgba(248,81,73,.4)}
.pill.remote{color:#3fb950;border-color:rgba(63,185,80,.4)}
.pill.company{color:#58a6ff;border-color:rgba(56,139,253,.4)}
.pill.date{color:#c9d1d9}
#status{font-size:12px;color:#8b949e;padding:6px 20px}
.alpha{color:#FFD600;font-weight:bold;font-style:italic;text-shadow:0 0 10px rgba(255,214,0,.35)}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo-brand{font-size:1.5rem;font-weight:bold;color:#fff}
.loading-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 20px}
.sb-spin-ring{width:40px;height:40px;border:3px solid rgba(0,184,212,0.15);border-top-color:#00B8D4;border-radius:50%;animation:sb-spin 0.8s linear infinite}
.shimmer-track{width:30%;max-width:320px;height:4px;background:#161b22;border-radius:2px;overflow:hidden}
.shimmer-bar{width:100%;height:100%;background:linear-gradient(90deg,#00B8D4,#00D4FF);border-radius:2px;animation:sb-shimmer 1.5s ease-in-out infinite}
@keyframes sb-spin{to{transform:rotate(360deg)}}
@keyframes sb-shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
</style></head><body>
<header><div class=logo-wrap><span class=logo-brand><span class=alpha>α</span>bet</span><h1 style="margin:0;font-size:1.75rem;font-weight:600">Tech Jobs Monitor</h1></div><div class=muted>live from the persistent database (tech_jobs) — refreshed on every load</div></header>
<div class=controls>
 <input id=q placeholder="search title / company / location" size=32>
 <select id=co><option value="">all companies</option></select>
 <select id=loc><option value="">all locations</option></select>
 <select id=src><option value="">all sources</option></select>
 <select id=st><option value="">active + closed</option><option value="1">active only</option><option value="0">closed only</option></select>
 <label><input type=checkbox id=rem> remote only</label>
</div>
<div id=status style=display:none></div>
<div id=loading class=loading-wrap>
 <div class=sb-spin-ring></div>
 <div class=shimmer-track><div class=shimmer-bar></div></div>
 <div id=loadprogress class=muted>Loading jobs...</div>
</div>
<table id=tblwrap style=display:none><thead><tr><th data-k=title>Title</th><th data-k=company>Company</th><th data-k=location>Location</th><th data-k=ats>Source</th><th data-k=posted_at>Posted</th><th data-k=scraped_at>Status</th></tr></thead><tbody id=tb></tbody></table>
<script>
const SB_URL="__SB_URL__", SB_ANON="__SB_ANON__";
let DATA=[], sortK="posted_at", asc=false;
 const tb=document.getElementById("tb"), q=document.getElementById("q"), co=document.getElementById("co"),
 src=document.getElementById("src"), st=document.getElementById("st"), rem=document.getElementById("rem"),
 loc=document.getElementById("loc"),
 cnt=document.getElementById("status"), loadwrap=document.getElementById("loading"),
 tblwrap=document.getElementById("tblwrap"), loadprogress=document.getElementById("loadprogress");
function slugify(name){return (""+(name||"")).toLowerCase().replace(/ /g,"-").replace(/\./g,"-")}
async function load(){
 let rows=[], offset=0;
 while(true){
  const r=await fetch(`${SB_URL}/rest/v1/tech_jobs?select=company,title,url,location,ats,posted_at,is_active,scraped_at&order=posted_at.desc.nullslast,scraped_at.desc&limit=1000&offset=${offset}`,
   {headers:{apikey:SB_ANON,Authorization:`Bearer ${SB_ANON}`,Range:`${offset}-${offset+999}`}});
  if(!r.ok){loadwrap.style.display="none";cnt.style.display="block";cnt.textContent=`load failed: ${r.status}`;return}
  const page=await r.json();
  rows=rows.concat(page);
  if(page.length<1000)break;
  offset+=1000;
  loadprogress.textContent=`Loaded page ${Math.floor(offset/1000)+1} of ~${Math.floor(offset/1000)+2}...`;
 }
 DATA=rows;
 loadwrap.style.display="none";
 tblwrap.style.display="table";
 cnt.style.display="block";
 const companies=[...new Set(DATA.map(d=>d.company).filter(Boolean))].sort();
 co.innerHTML="<option value=''>all companies</option>"+companies.map(c=>`<option>${c}</option>`).join("");
 const sources=[...new Set(DATA.map(d=>d.ats).filter(Boolean))].sort();
 src.innerHTML="<option value=''>all sources</option>"+sources.map(s=>`<option>${s}</option>`).join("");
 const locations=[...new Set(DATA.map(d=>(d.location||"").trim()).filter(Boolean))].sort();
 loc.innerHTML="<option value=''>all locations</option>"+locations.map(l=>`<option>${l}</option>`).join("");
 cnt.textContent=`${DATA.length} jobs · ${DATA.filter(d=>d.is_active).length} active`;
 render();
}
function esc(s){return (""+(s||"")).replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">")}
function render(){
 let r=DATA.filter(d=>{
  if(st.value!==""&&String(d.is_active?1:0)!==st.value)return false;
  if(co.value&&d.company!==co.value)return false;
  if(loc.value&&(d.location||"").trim()!==loc.value)return false;
  if(src.value&&d.ats!==src.value)return false;
  if(rem.checked&&!/remote/i.test(d.location))return false;
  const t=(q.value||"").toLowerCase();
  return !t||`${d.title} ${d.company} ${d.location}`.toLowerCase().includes(t);});
 r.sort((a,b)=>{const x=a[sortK],y=b[sortK];const c=(""+(x||"")).localeCompare(""+(y||""),undefined,{numeric:true});return asc?c:-c;});
 tb.innerHTML=r.map(d=>`<tr>
  <td><a href="${esc(d.url)}" target=_blank rel=noopener>${esc(d.title)}</a></td>
  <td><img class=logo src="logos/${slugify(d.company)}.png" alt="" onerror="this.style.display='none'"><span class="pill company">${esc(d.company)}</span></td><td><span class="pill${/remote/i.test(d.location||"")?" remote":""}">${esc(d.location)||"—"}</span></td>
  <td><span class=pill>${esc(d.ats)}</span></td>
  <td><span class="pill date">${esc((d.posted_at||"").slice(0,10))||"—"}</span></td>
  <td><span class="pill ${d.is_active?"":"closed"}">${d.is_active?"active":"closed"}</span></td>
 </tr>`).join("");
}
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortK)asc=!asc;else{sortK=k;asc=false}render()});
[q,co,loc,src,st,rem].forEach(el=>el.addEventListener("input",render));
load();
</script></body></html>
