<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Job Radar — Tech Jobs Monitor</title><style>
:root{color-scheme:dark}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;background:#0d1117;color:#e6edf3}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid #30363d;background:#0d1117}
header .muted{flex-basis:100%}
h1{margin:0 0 4px;font-size:1.75rem;font-weight:600}
.muted{color:#8b949e;font-size:.875rem}
.controls{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;position:sticky;top:0;background:#0d1117;border-bottom:1px solid #21262d;z-index:5}
input,select{background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 10px;font-size:.875rem}
input:focus,select:focus{border-color:#58a6ff;outline:none}
table{width:100%;border-collapse:separate;border-spacing:0}
td,th{padding:8px 12px;border-bottom:1px solid #21262d;text-align:left;vertical-align:middle}
th{position:sticky;top:var(--ctrl-h,61px);background:#161b22;color:#8b949e;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;z-index:2;box-shadow:0 1px 0 #30363d}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
.logo{width:22px;height:22px;border-radius:6px;background:#161b22;border:1px solid #30363d;object-fit:contain;padding:1px;vertical-align:middle;margin-right:2px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border:1px solid #30363d;border-radius:999px;color:#8b949e;background:#161b22}
.pill.closed{color:#f85149;border-color:rgba(248,81,73,.4)}
.pill.remote{color:#3fb950;border-color:rgba(63,185,80,.4)}
.pill.company{color:#58a6ff;border-color:rgba(56,139,253,.4)}
.pill.date{color:#c9d1d9}
.pill.applied{color:#FFD600;border-color:rgba(255,214,0,.45)}
#status{font-size:12px;color:#8b949e;padding:6px 20px}
.alpha{color:#FFD600;font-weight:bold;font-style:italic;text-shadow:0 0 10px rgba(255,214,0,.35)}
.logo-wrap{display:flex;align-items:center;gap:10px;flex:1}
.logo-brand{font-size:1.5rem;font-weight:bold;color:#fff}
.loading-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:38px 20px}
.abet-chip-perspective{perspective:620px;width:76px;height:76px}
.abet-chip-spinner{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:abet-chip-flip 2.4s cubic-bezier(.45,.05,.35,1) infinite}
.abet-chip-face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;border:3px solid #FDB515;outline:1px solid rgba(253,181,21,0.45);outline-offset:-5px;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,0.16),transparent 34%),radial-gradient(circle at 68% 78%,rgba(253,181,21,0.10),transparent 40%),radial-gradient(circle at 34% 30%,#29405a 0%,#16222f 45%,#0d131c 68%,#070B0F 100%);box-shadow:0 0 28px rgba(253,181,21,0.34),0 0 64px rgba(253,181,21,0.12),inset 0 0 18px rgba(253,181,21,0.14),inset 0 2px 6px rgba(0,0,0,0.65)}
.abet-chip-seg{position:absolute;left:50%;top:2px;width:8px;height:10px;margin-left:-4px;border-radius:3px;background:linear-gradient(180deg,rgba(255,214,102,1) 0%,rgba(253,181,21,0.92) 45%,rgba(180,120,8,0.9) 100%);box-shadow:inset 0 1px 1px rgba(255,255,255,0.45),inset 0 -1px 2px rgba(80,50,0,0.6);transform-origin:50% 36.0px}
.abet-chip-txt{font-family:'Times New Roman',serif;font-weight:700;font-size:43px;line-height:.88;transform:translateY(-1px);color:#FDB515;text-shadow:0 0 6px rgba(253,181,21,0.95),0 0 22px rgba(253,181,21,0.55),0 0 42px rgba(253,181,21,0.28)}
.abet-chip-back{transform:rotateY(180deg)}
.abet-chip-loader{display:flex;flex-direction:column;align-items:center;gap:16px;padding:38px 0}
@keyframes abet-chip-flip{0%{transform:rotateY(0deg) translateY(0)}45%{transform:rotateY(540deg) translateY(-10px)}70%{transform:rotateY(720deg) translateY(0)}78%{transform:rotateY(720deg) translateY(-3px)}86%{transform:rotateY(720deg) translateY(0)}100%{transform:rotateY(720deg) translateY(0)}}
@media (prefers-reduced-motion:reduce){.abet-chip-spinner{animation:none !important}}
.pills{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.co-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid #30363d;border-radius:999px;background:#161b22;color:#c9d1d9;font-size:12px;cursor:pointer}
.co-pill:hover{border-color:#58a6ff}
.co-pill img{width:18px;height:18px;border-radius:4px;object-fit:contain;background:#0d1117}
.co-pill .cnt{color:#8b949e;font-size:11px}
.co-pill.all{border-color:rgba(255,214,0,.45);color:#FFD600}
.frow{flex-basis:100%;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.co-pill .mark{display:inline-block;width:11px;transition:transform .15s}
.co-pill.off .mark{transform:rotate(-90deg)}
.apply-btn{font-size:11px;padding:3px 10px;border:1px solid #30363d;border-radius:999px;background:#161b22;color:#c9d1d9;cursor:pointer;white-space:nowrap}
.apply-btn.on{color:#FFD600;border-color:rgba(255,214,0,.5)}
</style></head><body>
<header><div class=logo-wrap><span class=logo-brand><span class=alpha>α</span>bet</span><h1 style="margin:0;font-size:1.75rem;font-weight:600">Tech Jobs Monitor</h1></div><button class="co-pill sec" id=sec-head><span class=mark>▾</span></button><div class=muted>live from the persistent database (tech_jobs) — refreshed on every load</div></header>
<div class=controls>
 <button class="co-pill sec" id=sec-filters><span class=mark>▾</span> filters</button>
 <button class="co-pill sec" id=sec-pills><span class=mark>▾</span> companies</button>
 <div id=filters class=frow>
 <input id=q placeholder="search title / company / location" size=32>
 <select id=loc><option value="">all locations</option></select>
 <select id=src><option value="">all sources</option></select>
 <select id=st><option value="">active + closed</option><option value="1">active only</option><option value="0">closed only</option><option value="applied">applied only</option></select>
 <label><input type=checkbox id=rem> remote only</label>
 </div>
 <div id=pills class=pills></div>
</div>
<div id=status style=display:none></div>
<div id=loading class=loading-wrap>
 <div class=abet-chip-loader role=status aria-live=polite><div class=abet-chip-perspective><div class=abet-chip-spinner><div class=abet-chip-face><span class=abet-chip-seg style="transform:rotate(0deg)"></span><span class=abet-chip-seg style="transform:rotate(45deg)"></span><span class=abet-chip-seg style="transform:rotate(90deg)"></span><span class=abet-chip-seg style="transform:rotate(135deg)"></span><span class=abet-chip-seg style="transform:rotate(180deg)"></span><span class=abet-chip-seg style="transform:rotate(225deg)"></span><span class=abet-chip-seg style="transform:rotate(270deg)"></span><span class=abet-chip-seg style="transform:rotate(315deg)"></span><span class=abet-chip-txt>α</span></div><div class="abet-chip-face abet-chip-back"><span class=abet-chip-seg style="transform:rotate(0deg)"></span><span class=abet-chip-seg style="transform:rotate(45deg)"></span><span class=abet-chip-seg style="transform:rotate(90deg)"></span><span class=abet-chip-seg style="transform:rotate(135deg)"></span><span class=abet-chip-seg style="transform:rotate(180deg)"></span><span class=abet-chip-seg style="transform:rotate(225deg)"></span><span class=abet-chip-seg style="transform:rotate(270deg)"></span><span class=abet-chip-seg style="transform:rotate(315deg)"></span><span class=abet-chip-txt>α</span></div></div></div></div>
 <div id=loadprogress class=muted>Loading jobs...</div>
</div>
<table id=tblwrap style=display:none><thead><tr><th data-k=title>Title</th><th data-k=company>Company</th><th data-k=location>Location</th><th data-k=ats>Source</th><th data-k=posted_at>Posted</th><th data-k=scraped_at>Status</th><th>Applied?</th></tr></thead><tbody id=tb></tbody></table>
<script>
const SB_URL="__SB_URL__", SB_ANON="__SB_ANON__", POLL="hourly";
let DATA=[], sortK="posted_at", asc=false, APPLIED=new Set(), COMP=new Set();
const tb=document.getElementById("tb"), q=document.getElementById("q"),
 src=document.getElementById("src"), st=document.getElementById("st"), rem=document.getElementById("rem"),
 loc=document.getElementById("loc"), pills=document.getElementById("pills"),
 cnt=document.getElementById("status"), loadwrap=document.getElementById("loading"),
 tblwrap=document.getElementById("tblwrap"), loadprogress=document.getElementById("loadprogress");
function slugify(name){return (""+(name||"")).toLowerCase().replace(/ /g,"-").replace(/\./g,"-")}
function esc(s){return (""+(s||"")).replace(/&/g,"\x26amp;").replace(/</g,"\x26lt;").replace(/>/g,"\x26gt;").replace(/"/g,"\x26quot;").replace(/'/g,"\x26#39;")}
const PALETTE=["#58a6ff","#3fb950","#f778ba","#d29922","#a371f7","#39c5cf","#ff7b72","#7ee787","#f0883e","#79c0ff","#db61a2","#56d364","#e3b341","#ffa657"];
function colorOf(name){let h=0;for(const ch of (""+name))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function setCtrlH(){document.documentElement.style.setProperty("--ctrl-h",(document.querySelector(".controls").offsetHeight+1)+"px")}
const akey=(c,u)=>c+"\u0001"+u;
const SBH={apikey:SB_ANON,Authorization:"Bearer "+SB_ANON};
async function loadApplied(){
 const set=new Set(); let off=0;
 try{
  while(true){
   const r=await fetch(SB_URL+"/rest/v1/applications?select=company,job_url&limit=1000&offset="+off,{headers:SBH});
   if(!r.ok)break;
   const pg=await r.json(); pg.forEach(a=>set.add(akey(a.company,a.job_url)));
   if(pg.length<1000)break; off+=1000;
  }
 }catch(e){}
 return set;
}
async function toggleApplied(company,url,title){
 const key=akey(company,url);
 try{
  if(APPLIED.has(key)){
   const f="company=eq."+encodeURIComponent(company)+"&job_url=eq."+encodeURIComponent(url);
   const r=await fetch(SB_URL+"/rest/v1/applications?"+f,{method:"DELETE",headers:SBH});
   if(r.ok){APPLIED.delete(key);render()}
  }else{
   const r=await fetch(SB_URL+"/rest/v1/applications",{method:"POST",headers:Object.assign({},SBH,{"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"}),body:JSON.stringify([{company:company,job_url:url,job_title:title}])});
   if(r.ok){APPLIED.add(key);render()}
  }
 }catch(e){}
}
async function load(){
 APPLIED=await loadApplied();
 let rows=[], offset=0;
 while(true){
  const r=await fetch(SB_URL+"/rest/v1/tech_jobs?select=company,title,url,location,ats,posted_at,is_active,scraped_at&order=posted_at.desc.nullslast,scraped_at.desc&limit=1000&offset="+offset,
   {headers:Object.assign({},SBH,{Range:offset+"-"+(offset+999)})});
  if(!r.ok){loadwrap.style.display="none";cnt.style.display="block";cnt.textContent="load failed: "+r.status;return}
  const page=await r.json();
  rows=rows.concat(page);
  if(page.length<1000)break;
  offset+=1000;
  loadprogress.textContent="Loaded page "+(Math.floor(offset/1000)+1)+" of ~"+(Math.floor(offset/1000)+2)+"...";
 }
 DATA=rows;
 loadwrap.style.display="none";
 tblwrap.style.display="table";
 cnt.style.display="block";
 const counts={};
 DATA.forEach(d=>{if(d.company)counts[d.company]=(counts[d.company]||0)+(d.is_active?1:0)});
 const companies=Object.keys(counts).sort((a,b)=>a.localeCompare(b));
 pills.innerHTML="<button class='co-pill all' data-c=''>All</button>"+companies.map(c=>"<button class='co-pill' data-c=\""+esc(c)+"\"><img src='logos/"+slugify(c)+".png' onerror=\"this.style.display='none'\"><span>"+esc(c)+"</span><span class='cnt'>"+counts[c]+"</span></button>").join("");
 setCtrlH();
 document.getElementById("sec-pills").innerHTML="<span class=mark>▾</span> companies <span class=cnt>"+companies.length+"</span>";
 const sources=[...new Set(DATA.map(d=>d.ats).filter(Boolean))].sort();
 src.innerHTML="<option value=''>all sources</option>"+sources.map(s=>"<option>"+esc(s)+"</option>").join("");
 const locations=[...new Set(DATA.map(d=>(d.location||"").trim()).filter(Boolean))].sort();
 loc.innerHTML="<option value=''>all locations</option>"+locations.map(l=>"<option>"+esc(l)+"</option>").join("");
 const active=DATA.filter(d=>d.is_active).length;
 const lastS=DATA.map(d=>d.scraped_at).filter(Boolean).sort().pop();
 let poll="";
 if(lastS){const mins=Math.max(0,Math.round((Date.now()-new Date(lastS).getTime())/60000));const rtxt=mins<60?mins+"m":Math.floor(mins/60)+"h "+(mins%60)+"m";poll=" · polling: "+POLL+" · last scrape "+rtxt+" ago"}
 cnt.textContent=DATA.length+" jobs · "+active+" active"+poll;
 render();
}
function render(){
 let r=DATA.filter(d=>{
  if(st.value==="applied"){if(!APPLIED.has(akey(d.company,d.url)))return false}
  else if(st.value!==""&&String(d.is_active?1:0)!==st.value)return false;
  if(COMP.size&&!COMP.has(d.company))return false;
  if(loc.value&&(d.location||"").trim()!==loc.value)return false;
  if(src.value&&d.ats!==src.value)return false;
  if(rem.checked&&!/remote/i.test(d.location))return false;
  const t=(q.value||"").toLowerCase();
  return !t||(d.title+" "+d.company+" "+d.location).toLowerCase().includes(t);});
 r.sort((a,b)=>{const x=a[sortK],y=b[sortK];const c=(""+(x||"")).localeCompare(""+(y||""),undefined,{numeric:true});return asc?c:-c;});
 tb.innerHTML=r.map(d=>{const on=APPLIED.has(akey(d.company,d.url));return "<tr>\n"+
  "<td><a href=\""+esc(d.url)+"\" target=_blank rel=noopener>"+esc(d.title)+"</a></td>"+
  "<td><img class=logo src='logos/"+slugify(d.company)+".png' alt='' onerror=\"this.style.display='none'\"><span class='pill company'>"+esc(d.company)+"</span></td>"+
  "<td><span class='pill"+(/remote/i.test(d.location||"")?" remote":"")+"'>"+(esc(d.location)||"—")+"</span></td>"+
  "<td><span class=pill>"+esc(d.ats)+"</span></td>"+
  "<td><span class='pill date'>"+(esc((d.posted_at||"").slice(0,10))||"—")+"</span></td>"+
  "<td><span class='pill "+(d.is_active?"":"closed")+"'>"+(d.is_active?"active":"closed")+"</span>"+(on?" <span class='pill applied'>applied</span>":"")+"</td>"+
  "<td><button class='apply-btn"+(on?" on":"")+"' data-c=\""+esc(d.company)+"\" data-u=\""+esc(d.url)+"\" data-t=\""+esc(d.title)+"\">"+(on?"✓ applied":"mark applied")+"</button></td>\n</tr>"}).join("");
}
function secToggle(btnId,secSel){const b=document.getElementById(btnId),s=document.querySelector(secSel);b.addEventListener("click",()=>{const hide=s.style.display!=="none";s.style.display=hide?"none":"";b.classList.toggle("off",hide)})}
secToggle("sec-head","header .muted");secToggle("sec-filters","#filters");secToggle("sec-pills","#pills");
pills.addEventListener("click",e=>{
 const b=e.target.closest(".co-pill"); if(!b)return;
 const c=b.dataset.c;
 if(!c){COMP.clear()}
 else if(COMP.has(c))COMP.delete(c); else COMP.add(c);
 pills.querySelectorAll(".co-pill").forEach(p=>{
  const pc=p.dataset.c, col=pc?colorOf(pc):"#FFD600";
  const on=!pc?COMP.size===0:COMP.has(pc);
  p.classList.toggle("active",on);
  p.style.borderColor=on?col:""; p.style.background=on?col+"22":"";
 });
 render();
});
tb.addEventListener("click",e=>{
 const b=e.target.closest(".apply-btn"); if(!b)return;
 toggleApplied(b.dataset.c,b.dataset.u,b.dataset.t);
});
document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(k===sortK)asc=!asc;else{sortK=k;asc=false}render()});
[q,loc,src,st,rem].forEach(el=>el.addEventListener("input",render));
window.addEventListener("resize",setCtrlH);
new ResizeObserver(setCtrlH).observe(document.querySelector(".controls"));
load();
</script></body></html>
